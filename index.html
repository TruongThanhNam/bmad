<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghi chú hàng ngày</title>
  <!--
    Theme đọc ở đây và KHÔNG ở đâu khác: ngoại lệ duy nhất của AD-2 (AD-19). Script phải ĐỒNG
    BỘ, NỘI TUYẾN và nằm TRƯỚC `<link rel="stylesheet">` — chỉ khi đủ bốn tính chất đó thì
    `data-theme` mới có mặt trước lần vẽ đầu tiên, và mở tab giữa lúc làm việc không nháy một
    khung hình sáng chói. Đừng import `app/adapters/localstorage.js`: nó là ES module, nạp nó
    là bất đồng bộ, là mất đúng thứ đoạn mã này mua. Chuỗi 'ghichu.theme' vì thế bị viết lại
    lần thứ hai ở đây — trùng lặp có ý thức mà AD-19 cho phép.

    Script KHÔNG BAO GIỜ ghi xuống `localStorage`: key chỉ mang lựa chọn tường minh của người
    dùng, nên "vắng mặt" phải giữ nghĩa "chưa chọn" cho nút toggle của Epic 3.
  -->
  <script>
    (function () {
      var theme = null;
      try {
        var daLuu = localStorage.getItem('ghichu.theme');
        if (daLuu === 'light' || daLuu === 'dark') theme = daLuu;
      } catch (loi) {
        theme = null;
      }
      if (theme === null) {
        try {
          theme =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        } catch (loi) {
          theme = 'light';
        }
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <!--
    Bốn tầng dọc cố định (Story 2.1). Thứ tự DOM Ở ĐÂY LÀ THỨ TỰ ĐỌC và cũng là thứ tự tab:
    ô soạn thảo → khay tìm kiếm + lọc ngày → lưới ghi chú → chân trang. Không một chỗ nào
    trong CSS đảo lại thứ tự này (không `order`, không `row-reverse`) — đảo là làm bàn phím
    đi một đường còn mắt đi một đường khác.

    Hai điều khiển đã có hành vi: ô soạn thảo ở tầng 1 (Story 2.2, `app/view/o-soan.js`) và nút
    theme ở chân trang (Story 3.3, `app/view/nut-theme.js`). Ô tìm, ô ngày và hai link chân
    trang vẫn là hình dạng thuần; hành vi của chúng thuộc Epic 6 (tra cứu) và Story 4.1/4.3.
  -->
  <!--
    Dải băng thông báo (Story 3.1), và nó ở NGOÀI `<main>` có lý do: nó không phải nội dung
    chính, và nó phải ĐẨY ba tầng dưới xuống chứ không phủ lên (UX-DR-17). `<body>` là flex
    column, `.dai-bang` là `flex: none` và `.khung` là `flex: 1` — nên dải băng lấy đúng chiều
    cao nó cần và phần còn lại tự co. Một dải băng nằm trong `<main>` sẽ nằm trong vùng của
    `.khung` và đẩy chân trang ra khỏi khung nhìn.

    Nó KHÔNG mang class `tang`: bốn tầng của Story 2.1 vẫn là bốn, và thứ tự DOM của chúng
    không đổi một dòng.

    Rỗng nguyên ở dạng TĨNH, y như `.luoi`: `app/view/banner.js` là nơi DUY NHẤT ghi vào DOM
    của nó. Không một khoảng trắng nào bên trong thẻ — `.dai-bang:empty` trong
    `app/style.css` là thứ làm nó không chiếm chiều cao, và một khoảng trắng làm nó không còn
    `:empty`.

    `role="status"` cộng `aria-live="polite"`: chữ do JS chèn vào sau khi trang tải, nên không
    có vùng sống thì trình đọc màn hình không bao giờ đọc nó lên. `polite` chứ không
    `assertive` — nó không cắt lời người đang gõ.
  -->
  <div class="dai-bang" role="status" aria-live="polite"></div>

  <main class="khung">
    <section class="tang tang-soan" aria-label="Ô soạn thảo">
      <div class="container">
        <!-- Placeholder để TRỐNG là quyết định của DESIGN.md: con trỏ nháy là tín hiệu duy
             nhất. Chiều cao đến từ `--composer-min-h` cộng phép tự cao theo nội dung trong
             `app/view/o-soan.js`, nên KHÔNG có `rows` — một con số đếm theo dòng không bao
             giờ khớp được 92px của DESIGN.md.

             `autofocus` là thuộc tính HTML, không phải một lời gọi JS: dòng "CSS hoặc JS
             không tải được" của I/O Matrix đòi con trỏ vẫn nằm sẵn trong ô, và chỉ trình
             duyệt làm việc đó mới đúng ngay cả khi không module nào chạy.

             KHÔNG có `maxlength`, và đó là một lệnh cấm: `maxlength` cắt chữ vừa dán trong im
             lặng (AD-14, AD-17). Trần ký tự chặn ở TẦNG GHI — `state.js` từ chối gọi cổng khi
             quá trần, nhưng chữ vẫn nằm nguyên trong ô và trong state. -->
        <textarea class="o-soan" id="o-soan" aria-label="Ghi chú mới"
                  aria-describedby="o-soan-nhac" autofocus></textarea>
        <!-- Microcopy GHIM của EXPERIENCE.md ("Gợi ý dưới ô soạn thảo"), nguyên văn. Nó nói
             được bấm gì, KHÔNG nói chữ đã lưu hay chưa — không chỉ báo trạng thái nào ở đây
             (AD-16). Bản thân `Ctrl+Enter` nối ở `app/view/o-soan.js`: nó gọi `chotGhiChu()`,
             ô trống lại và con trỏ ở lại — thành công thì giao diện im lặng tuyệt đối.

             `aria-describedby` nối nó vào ô: placeholder để trống là một quyết định có chủ ý,
             nên đây là CHỈ DẪN DUY NHẤT của sản phẩm — không nối thì trình đọc màn hình đọc ô
             lên mà không bao giờ đọc nó. -->
        <p class="o-soan-nhac" id="o-soan-nhac">Ctrl+Enter để chốt</p>
      </div>
    </section>

    <section class="tang tang-khay" aria-label="Tìm kiếm và lọc ngày">
      <div class="container">
        <div class="khay">
          <label class="khay-nhan" for="o-tim">tìm</label>
          <input class="o-nhap o-tim" id="o-tim" type="text" placeholder="từ khóa">
          <label class="khay-nhan" for="o-ngay">ngày</label>
          <span class="o-ngay-boc">
            <input class="o-nhap o-ngay" id="o-ngay" type="text" placeholder="dd/MM/yyyy">
            <!-- Icon DUY NHẤT của sản phẩm, và nó là SVG nội tuyến: AD-12 cấm mọi tài nguyên
                 mạng, nên không font icon và không `url(...)`. `stroke="currentColor"` để nó
                 đi theo token màu của phần tử bọc, không tự khai một màu nào. -->
            <svg class="icon-lich" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"
                 focusable="false" fill="none" stroke="currentColor" stroke-width="1.25">
              <rect x="2" y="3.5" width="12" height="10" rx="1"></rect>
              <line x1="2" y1="6.5" x2="14" y2="6.5"></line>
              <line x1="5.5" y1="2" x2="5.5" y2="4.5"></line>
              <line x1="10.5" y1="2" x2="10.5" y2="4.5"></line>
            </svg>
          </span>
        </div>
      </div>
    </section>

    <!-- Tầng cuộn DUY NHẤT của trang. Ba tầng kia `flex: none`; tầng này `flex: 1` và
         `min-block-size: 0` — thiếu vế sau thì flex item không co dưới kích thước nội dung
         và thanh cuộn nhảy ra ngoài trang, đúng thứ AC cấm. -->
    <section class="tang tang-luoi" aria-label="Ghi chú">
      <div class="container">
        <!-- Rỗng nguyên ở dạng TĨNH, và vẫn vậy: `app/view/luoi.js` sinh mọi ô lúc chạy từ
             `state.notes`, nên không nội dung mẫu nào ở đây, kể cả tạm. Story 2.6 đã chốt
             trạng thái rỗng: hôm nay chưa có gì thì vùng này KHÔNG một ký tự nào — không lời
             nhắn, không hình minh họa, không skeleton. Hình dạng mẩu giấy là Story 2.5. -->
        <div class="luoi"></div>
      </div>
    </section>
  </main>

  <footer class="tang tang-chan">
    <div class="container chan">
      <!-- `<button>` chứ không `<a href="#">`: hai thứ này là HÀNH ĐỘNG, không phải điều
           hướng. Một `href="#"` đổi URL và đẩy một mục vào lịch sử ngay khi bấm — trái hẳn
           AC "bấm vào thì không có gì xảy ra" — và trình đọc màn hình đọc nó thành "liên
           kết". Chúng chỉ MANG DÁNG link (`.chan-link` gạch chân), không mang ngữ nghĩa.

           `id` (Story 4.2) để `app/view/chan-trang.js` chọn được đúng từng nút mà không phải
           dựa vào thứ tự DOM hay nhãn chữ: `.chan-link` khớp cả hai, và một bộ chọn theo nhãn
           là chỗ đổi microcopy làm gãy hành vi. `#chan-nap` có `id` ngay bây giờ dù chưa có
           handler nào — Story 4.3 chỉ nối vào, không phải sửa lại chân trang. -->
      <button id="chan-xuat" class="chan-link" type="button">xuất sao lưu</button>
      <span class="chan-cham" aria-hidden="true">·</span>
      <button id="chan-nap" class="chan-link" type="button">nạp lại</button>
      <!-- Chỗ đứng của dòng nhắc sao lưu (Story 4.4), rỗng nguyên ở đây và CÙNG DÒNG với hai
           link — UX-DR-19. Đặt sẵn chỗ ngay từ 4.1 để 4.4 chỉ đổ chữ vào, không phải sắp lại
           chân trang; và để ba cam kết của 4.1 kiểm được ngay bây giờ: hai link đứng độc lập
           với dòng nhắc, nên trên máy mới — lúc dòng nhắc chưa có gì để nói — chúng vẫn ở đó.

           Không `aria-live`: dòng nhắc là THỤ ĐỘNG, nó không được cướp lời trình đọc màn hình
           giữa lúc Nam đang gõ. Không `tabindex`: nó là chữ, không phải điều khiển, và thêm
           một điểm dừng bàn phím giữa `nạp lại` và nút theme là phá đúng thứ tự tab đã chốt.
           Rỗng thì `.chan-nhac:empty` trong `app/style.css` gỡ nó khỏi luồng flex để nó không
           sinh thêm một khoảng `gap` ma nào. -->
      <span class="chan-nhac"></span>
      <!-- Nhãn TĨNH, và nó cố ý có thể lệch một khung hình với nhãn thật: khi lựa chọn đã lưu
           là `dark`, script trong `<head>` đặt `data-theme="dark"` trước lần vẽ đầu, nhưng dòng
           chữ ở đây vẫn đọc `nền tối` cho tới khi `app/view/nut-theme.js` vẽ lượt đầu tiên.
           Sai CHỮ một khung hình nhẹ hơn hẳn sai MÀU cả trang, và sửa nó đòi ghi vào DOM từ
           `<head>` — nơi `<body>` còn chưa tồn tại.

           Nhãn vẫn phải có mặt ở dạng tĩnh: bàn phím và trình đọc màn hình cần một nút CÓ TÊN
           ngay cả khi không module nào chạy. Ai đổi chuỗi này thì đổi cùng lúc ba chỗ — ở đây,
           `NHAN` trong `app/view/nut-theme.js`, và ca `chân trang có hai điều khiển dáng link
           và nút theme nhãn chữ, đẩy sang phải bằng lề` trong `test/bo-cuc-bon-tang.test.js`
           (nêu theo TÊN chứ không theo số dòng — một dòng chèn thêm ở trên làm số dòng sai mà
           không ai thấy). -->
      <button class="nut-theme" type="button">nền tối</button>
    </div>
  </footer>

  <!--
    Chỗ gắn hộp thoại xác nhận xóa (Story 5.3). Nó ở NGOÀI `<main>` và SAU `<footer>`, có lý
    do: nó không phải nội dung chính, nó phủ LÊN cả trang (overlay `position: fixed`), và bốn
    tầng dọc của Story 2.1 vẫn là bốn — thứ tự DOM của chúng không đổi một dòng.

    Rỗng nguyên ở dạng TĨNH, y như `.luoi` và `.dai-bang`: `app/view/hop-thoai.js` là nơi DUY
    NHẤT ghi vào DOM của nó, và hộp thoại CHỈ có trong DOM khi đang mở. Không có nó thì một
    overlay vô hình vẫn phủ cả trang và ăn mọi cú bấm.

    KHÔNG `aria-live` và KHÔNG `role` ở đây: chỗ gắn là một cái hộp rỗng, còn ngữ nghĩa
    (`role="dialog"`, `aria-modal`) nằm trên chính hộp thoại do view dựng — một vùng sống bọc
    ngoài sẽ làm trình đọc màn hình đọc cả hộp lên hai lần.
  -->
  <div class="hop-thoai-goc"></div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
